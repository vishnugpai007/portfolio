<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#17191F" />
      <stop offset="100%" stopColor="#101116" />
    </linearGradient>

    <!-- Subtle texture pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#343741" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Radial accent lighting -->
    <radialGradient id="accentGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#7599FF" stopOpacity="0.12" />
      <stop offset="100%" stopColor="#7599FF" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#gridPattern)" />
  <rect width="800" height="1000" fill="url(#accentGlow)" />

  <!-- Outer frame border -->
  <rect x="24" y="24" width="752" height="952" stroke="#343741" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="928" stroke="#343741" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.6" />

  <!-- Camera / Editorial viewfinder corner brackets -->
  <g stroke="#7599FF" stroke-width="2" stroke-linecap="square">
    <!-- Top-Left -->
    <path d="M 56 80 L 56 56 L 80 56" />
    <!-- Top-Right -->
    <path d="M 744 80 L 744 56 L 720 56" />
    <!-- Bottom-Left -->
    <path d="M 56 920 L 56 944 L 80 944" />
    <!-- Bottom-Right -->
    <path d="M 744 920 L 744 944 L 720 944" />
  </g>

  <!-- Editorial Top Metadata -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#A5A7AE" letter-spacing="2">
    <text x="60" y="95">FIG. 01 // PORTRAIT</text>
    <text x="740" y="95" text-anchor="end">ASPECT 4:5</text>
    <line x1="60" y1="112" x2="740" y2="112" stroke="#343741" stroke-width="1" />
  </g>

  <!-- Center Abstract Silhouette & Monogram -->
  <g transform="translate(400, 480)">
    <!-- Halo ring -->
    <circle cx="0" cy="-30" r="140" fill="none" stroke="#343741" stroke-width="1.5" />
    <circle cx="0" cy="-30" r="148" fill="none" stroke="#7599FF" stroke-width="1" stroke-dasharray="8 12" stroke-opacity="0.5" />

    <!-- Stylized Head & Shoulders Silhouette -->
    <!-- Head -->
    <circle cx="0" cy="-70" r="54" fill="#20232B" stroke="#7599FF" stroke-width="1.5" />
    <!-- Shoulders / Torso arc -->
    <path d="M -110 90 C -110 0, -60 -15, 0 -15 C 60 -15, 110 0, 110 90 Z" fill="#20232B" stroke="#343741" stroke-width="1.5" />

    <!-- Monogram overlay -->
    <text x="0" y="-62" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#F5F3EE" text-anchor="middle" letter-spacing="4">
      VGP
    </text>

    <!-- Focal reticle crosses -->
    <path d="M -180 -30 L -160 -30 M 160 -30 L 180 -30 M 0 -210 L 0 -190 M 0 130 L 0 150" stroke="#7599FF" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Bottom Editorial Notice / Placeholder Instruction -->
  <g transform="translate(400, 770)" text-anchor="middle">
    <!-- Notice box -->
    <rect x="-240" y="0" width="480" height="56" rx="4" fill="#20232B" stroke="#343741" stroke-width="1" />
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7599FF" letter-spacing="1.5">
      [ PHOTO PLACEHOLDER ]
    </text>
    <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A5A7AE" letter-spacing="1">
      REPLACE WITH VISHNU'S REAL PORTRAIT
    </text>
  </g>

  <!-- Bottom Coordinates -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#A5A7AE" letter-spacing="1.5">
    <line x1="60" y1="880" x2="740" y2="880" stroke="#343741" stroke-width="1" />
    <text x="60" y="910">FISAT // ANGAMALY, KERALA</text>
    <text x="740" y="910" text-anchor="end">B.TECH CSE '29</text>
  </g>
</svg>
