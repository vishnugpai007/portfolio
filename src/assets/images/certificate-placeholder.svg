<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#17191F" />
      <stop offset="50%" stopColor="#101116" />
      <stop offset="100%" stopColor="#17191F" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="certGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#7599FF" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#7599FF" stopOpacity="0" />
    </radialGradient>

    <!-- Geometric Grid Pattern -->
    <pattern id="certGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#343741" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="560" fill="url(#certBg)" />
  <rect width="800" height="560" fill="url(#certGrid)" />
  <rect width="800" height="560" fill="url(#certGlow)" />

  <!-- Outer Architectural Framing -->
  <rect x="20" y="20" width="760" height="520" stroke="#343741" stroke-width="1.5" />
  <rect x="30" y="30" width="740" height="500" stroke="#343741" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.6" />
  <rect x="38" y="38" width="724" height="484" stroke="#7599FF" stroke-width="1" stroke-opacity="0.4" />

  <!-- Corner Ornamental Reticles -->
  <g stroke="#7599FF" stroke-width="2" stroke-linecap="square">
    <path d="M 48 70 L 48 48 L 70 48" />
    <path d="M 752 70 L 752 48 L 730 48" />
    <path d="M 48 490 L 48 512 L 70 512" />
    <path d="M 752 490 L 752 512 L 730 512" />
  </g>

  <!-- Top Metadata Bar -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#A5A7AE" letter-spacing="2">
    <text x="54" y="72">VERIFIED CERTIFICATION</text>
    <text x="746" y="72" text-anchor="end">DOC. REF // 05-HTML5</text>
    <line x1="54" y1="88" x2="746" y2="88" stroke="#343741" stroke-width="1" />
  </g>

  <!-- Center Seal / Crest -->
  <g transform="translate(400, 210)">
    <!-- Outer concentric rings -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#343741" stroke-width="1" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="#7599FF" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="46" fill="#20232B" stroke="#343741" stroke-width="1" />

    <!-- Center Monogram -->
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#F5F3EE" text-anchor="middle" letter-spacing="3">
      HTML5
    </text>

    <!-- Radiating Accents -->
    <path d="M -80 0 L -68 0 M 68 0 L 80 0 M 0 -80 L 0 -68 M 0 68 L 0 80" stroke="#7599FF" stroke-width="1.5" stroke-opacity="0.7" />
  </g>

  <!-- Certificate Heading -->
  <g text-anchor="middle">
    <text x="400" y="320" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#F5F3EE" letter-spacing="1">
      HTML5 – Web Application Development
    </text>
    <text x="400" y="348" font-family="'Inter', sans-serif" font-size="13" fill="#A5A7AE" letter-spacing="0.5">
      Foundational certification in modern HTML5 semantic architecture and web application development.
    </text>
  </g>

  <!-- Center Replaceable Banner -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <rect x="-220" y="0" width="440" height="48" rx="6" fill="#20232B" stroke="#343741" stroke-width="1" />
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7599FF" letter-spacing="2">
      [ CERTIFICATE IMAGE PLACEHOLDER ]
    </text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A5A7AE" letter-spacing="1">
      REPLACE WITH VISHNU'S AUTHENTIC CREDENTIAL ASSET
    </text>
  </g>

  <!-- Bottom Verification Bar -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#A5A7AE" letter-spacing="1.5">
    <line x1="54" y1="480" x2="746" y2="480" stroke="#343741" stroke-width="1" />
    <text x="54" y="504">CANDIDATE: VISHNU G PAI</text>
    <text x="746" y="504" text-anchor="end">STATUS: ISSUED &amp; ARCHIVED</text>
  </g>
</svg>
